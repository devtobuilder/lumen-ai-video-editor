name: Publication security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check source publication policy
        run: node scripts/check-publication.mjs
      - name: Install verified free secret scanner
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $archive$" checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
      - name: Scan exact tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/source-audit"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/source-audit"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-audit" --redact --no-banner
